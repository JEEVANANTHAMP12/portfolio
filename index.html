<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M18 43V21h7v22h-7Zm13 0V21h8.5C46 21 50 25 50 32s-4 11-10.5 11H31Zm7-6h1.2c2.8 0 4.5-1.8 4.5-5s-1.7-5-4.5-5H38v10Z' fill='%2322d3ee'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Jeevanantham - frontend developer and AI/Data Science student building clean React interfaces, dashboards, and AI-focused web projects." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" /></noscript>
    
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{background:#0a0a0a;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;margin:0;overflow-x:hidden}
      #root{min-height:100vh}
      .loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0a0a0a;gap:16px}
      .loader-ring{width:36px;height:36px;border:2px solid rgba(255,255,255,0.08);border-top-color:#22d3ee;border-radius:50%;animation:spin .8s linear infinite}
      .loader-text{font-size:12px;color:rgba(255,255,255,0.42);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    
    <title>Jeevanantham | Frontend Developer</title>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen" id="initial-loader">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const observer = new MutationObserver(function() {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.4s ease';
          setTimeout(function() { loader.remove(); }, 400);
        }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
  </body>
</html>
