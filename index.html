<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Jeevanantham P - Full Stack Developer & AI Enthusiast. Portfolio showcasing web development projects and skills." />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://smtpjs.com" />
    
    <!-- Preload critical font with display swap -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" /></noscript>
    
    <!-- Orbitron font for logo -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" /></noscript>
    
    <!-- Critical CSS inline for faster FCP -->
    <style>
      body{background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;margin:0}
      #root{min-height:100vh}
      .loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#000}
    </style>
    
    <title>Portfolio - JEEVANANTHAM P</title>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state for better perceived performance -->
      <div class="loading-screen" id="initial-loader">
        <div style="width:32px;height:32px;border:2px solid #333;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite"></div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove loader once React mounts
      window.addEventListener('load', function() {
        var loader = document.getElementById('initial-loader');
        if (loader) loader.style.display = 'none';
      });
    </script>
  </body>
</html>
